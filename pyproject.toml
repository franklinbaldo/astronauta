[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astronauta"
version = "0.1.0"
description = "Live Django-admin-style interface for OKF bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "okf-parser @ git+https://github.com/franklinbaldo/okf-parser.git@9da4b53724295b759a9cfbc83ed3f1d4d6291f8c",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
astronauta = "astronauta.cli:app"

[tool.hatch.metadata]
# Pin the immutable reviewed upstream release commit until Astronauta can
# return to a normal published SemVer dependency.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/astronauta"]
