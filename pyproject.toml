[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astronauta"
version = "0.1.0"
description = "Live Django-admin-style interface for OKF bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "okf-parser[graphql]==0.45.1",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
astronauta = "astronauta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/astronauta"]
