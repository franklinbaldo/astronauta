[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astronauta"
version = "0.1.0"
description = "Live Django-admin-style interface for OKF bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "okf-parser @ git+https://github.com/franklinbaldo/okf-parser.git@68e630c4ca66864dee022af0a8c7b19375a33538",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
astronauta = "astronauta.cli:app"

[tool.hatch.metadata]
# The conflict-safe edit service is stacked upstream and not published yet.
# Keep the exact reviewed Git commit explicit until the stack lands in a release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/astronauta"]
