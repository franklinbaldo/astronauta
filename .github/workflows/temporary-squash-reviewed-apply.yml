name: Temporary squash reviewed apply

on:
  push:
    branches: [stack/09-reviewed-apply-token]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/09-reviewed-apply-token
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Restack only reviewed-apply product files on final #16
        shell: bash
        run: |
          set -euo pipefail
          keep="$RUNNER_TEMP/reviewed-apply"
          mkdir -p "$keep/src/actions" "$keep/src/astronauta" "$keep/src/lib/server" "$keep/src/pages" "$keep/tests"
          cp pyproject.toml "$keep/pyproject.toml"
          cp src/actions/index.ts "$keep/src/actions/index.ts"
          cp src/astronauta/mutations.py "$keep/src/astronauta/mutations.py"
          cp src/lib/server/okf.ts "$keep/src/lib/server/okf.ts"
          cp src/pages/apply.astro "$keep/src/pages/apply.astro"
          cp tests/test_apply_preview_binding.py "$keep/tests/test_apply_preview_binding.py"
          cp tests/test_write_gateway.py "$keep/tests/test_write_gateway.py"

          git fetch origin stack/08-duckdb-apply-admin
          git reset --hard origin/stack/08-duckdb-apply-admin
          mkdir -p src/actions src/astronauta src/lib/server src/pages tests
          cp "$keep/pyproject.toml" pyproject.toml
          cp "$keep/src/actions/index.ts" src/actions/index.ts
          cp "$keep/src/astronauta/mutations.py" src/astronauta/mutations.py
          cp "$keep/src/lib/server/okf.ts" src/lib/server/okf.ts
          cp "$keep/src/pages/apply.astro" src/pages/apply.astro
          cp "$keep/tests/test_apply_preview_binding.py" tests/test_apply_preview_binding.py
          cp "$keep/tests/test_write_gateway.py" tests/test_write_gateway.py

          grep -F 'okf-parser.git@9da4b53724295b759a9cfbc83ed3f1d4d6291f8c' pyproject.toml
          grep -F 'expected_preview_token=preview_token' src/astronauta/mutations.py
          grep -F 'applyWrite(input.sql, input.preview_token)' src/actions/index.ts
          grep -F 'name="preview_token"' src/pages/apply.astro
          uv lock
      - name: Validate exact final product tree
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s tests -v
          uv build
          bun install --frozen-lockfile
          bun run verify
          bun run build
      - name: Prove exact preview token crosses real Astro Actions
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/reviewed-apply-okf"
          page_url='http://127.0.0.1:4321/apply'
          mkdir -p "$fixture"
          printf '%s\n' '---' 'type: Note' 'title: Hello' 'status: todo' '---' 'Body' > "$fixture/note.md"

          uv run astronauta "$fixture" --write --port 8765 > "$RUNNER_TEMP/gateway.log" 2>&1 &
          gateway_pid=$!
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > "$RUNNER_TEMP/astro.log" 2>&1 &
          astro_pid=$!
          trap 'kill "$astro_pid" "$gateway_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$page_url" > "$RUNNER_TEMP/before.html"; then break; fi
            if [ "$attempt" -eq 30 ]; then cat "$RUNNER_TEMP/gateway.log"; cat "$RUNNER_TEMP/astro.log"; exit 1; fi
            sleep 1
          done

          python - "$RUNNER_TEMP/before.html" "$RUNNER_TEMP/preview-action" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
          if len(actions) != 1 or 'applyPreview' not in actions[0]:
              raise SystemExit(f'expected one applyPreview form, got {actions}')
          open(sys.argv[2], 'w', encoding='utf-8').write(actions[0])
          PY

          preview_action=$(cat "$RUNNER_TEMP/preview-action")
          case "$preview_action" in
            http*) preview_url="$preview_action" ;;
            \?*) preview_url="$page_url$preview_action" ;;
            /*) preview_url="http://127.0.0.1:4321$preview_action" ;;
            *) preview_url="http://127.0.0.1:4321/$preview_action" ;;
          esac
          sql='UPDATE "Note" SET status = '\''done'\'' WHERE __okf_concept_id = '\''note'\'''

          curl --fail-with-body --silent --show-error "$preview_url" \
            --header 'Origin: http://127.0.0.1:4321' \
            --header "Referer: $page_url" \
            --data-urlencode "sql=$sql" > "$RUNNER_TEMP/preview.html"

          grep -F '1 arquivo(s) serão alterados' "$RUNNER_TEMP/preview.html"
          grep -F 'status: todo' "$fixture/note.md"
          python - "$RUNNER_TEMP/preview.html" "$RUNNER_TEMP/commit-action" "$RUNNER_TEMP/token" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
          commits = [action for action in actions if 'applyCommit' in action]
          if len(commits) != 1:
              raise SystemExit(f'expected one applyCommit form, got {actions}')
          token = re.search(r'name="preview_token" value="([^"]+)"', html)
          if token is None:
              raise SystemExit('preview token hidden field missing')
          if not token.group(1).startswith('okf-apply-preview-v1-sha256:'):
              raise SystemExit(f'unexpected token {token.group(1)!r}')
          open(sys.argv[2], 'w', encoding='utf-8').write(commits[0])
          open(sys.argv[3], 'w', encoding='utf-8').write(token.group(1))
          PY

          commit_action=$(cat "$RUNNER_TEMP/commit-action")
          preview_token=$(cat "$RUNNER_TEMP/token")
          case "$commit_action" in
            http*) commit_url="$commit_action" ;;
            \?*) commit_url="$page_url$commit_action" ;;
            /*) commit_url="http://127.0.0.1:4321$commit_action" ;;
            *) commit_url="http://127.0.0.1:4321/$commit_action" ;;
          esac

          curl --fail-with-body --silent --show-error "$commit_url" \
            --header 'Origin: http://127.0.0.1:4321' \
            --header "Referer: $page_url" \
            --data-urlencode "sql=$sql" \
            --data-urlencode "preview_token=$preview_token" > "$RUNNER_TEMP/commit.html"

          grep -F 'Alterações gravadas' "$RUNNER_TEMP/commit.html"
          grep -F 'status: done' "$fixture/note.md"
      - name: Publish one clean semantic commit on final #16
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock src/actions/index.ts src/astronauta/mutations.py \
            src/lib/server/okf.ts src/pages/apply.astro tests/test_apply_preview_binding.py \
            tests/test_write_gateway.py
          git commit -m 'fix(apply): bind commit to reviewed preview token'
          git fetch origin stack/09-reviewed-apply-token
          git push --force-with-lease origin HEAD:stack/09-reviewed-apply-token
