name: Temporary apply admin wire

on:
  pull_request:
    branches:
      - stack/07-body-editor

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'stack/08-duckdb-apply-admin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/08-duckdb-apply-admin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Extend OkfClient, Actions and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('src/lib/okf.ts')
          text = client.read_text(encoding='utf-8')
          class_index = text.find('class OkfClient')
          if class_index < 0:
              raise SystemExit('OkfClient marker missing')
          if 'export interface ApplyMutationResult' not in text:
              interfaces = '''export interface ApplyMutationResult {
            readonly changed_paths: readonly string[];
            readonly skipped_paths: readonly string[];
            readonly succeeded: boolean;
            readonly written: boolean;
            readonly validation: readonly MutationDiagnostic[];
            readonly conflict_paths: readonly string[];
            readonly error?: string;
          }

          '''
              text = text[:class_index] + interfaces + text[class_index:]

          export_marker = 'export const okf = new OkfClient();'
          export_index = text.find(export_marker)
          if export_index < 0:
              raise SystemExit('okf singleton marker missing')
          class_close = text.rfind('}\n\n', 0, export_index)
          if class_close < class_index:
              raise SystemExit('OkfClient close marker missing')
          if 'applyPreview(sql: string)' not in text:
              methods = '''  applyPreview(sql: string): Promise<ApplyMutationResult> {
            return this.request<ApplyMutationResult>("apply_preview", { sql });
          }

            applyWrite(sql: string): Promise<ApplyMutationResult> {
            return this.request<ApplyMutationResult>("apply_write", { sql });
          }

          '''
              text = text[:class_close] + methods + text[class_close:]
          client.write_text(text, encoding='utf-8')

          actions = Path('src/actions/index.ts')
          action_text = actions.read_text(encoding='utf-8')
          if 'const applyInput' not in action_text:
              marker = 'function actionFailure'
              pos = action_text.find(marker)
              if pos < 0:
                  raise SystemExit('actionFailure marker missing')
              action_text = action_text[:pos] + '''const applyInput = z.object({
            sql: z.string().min(1).max(256 * 1024),
          });

          ''' + action_text[pos:]
          if 'applyPreview: defineAction' not in action_text:
              closing = action_text.rfind('};')
              if closing < 0:
                  raise SystemExit('actions server closing marker missing')
              additions = '''
            applyPreview: defineAction({
              accept: "form",
              input: applyInput,
              handler: async (input) => {
                try {
                  return {
                    input,
                    mutation: await okf.applyPreview(input.sql),
                  };
                } catch (error) {
                  actionFailure(error);
                }
              },
            }),

            applyCommit: defineAction({
              accept: "form",
              input: applyInput,
              handler: async (input) => {
                try {
                  return {
                    input,
                    mutation: await okf.applyWrite(input.sql),
                  };
                } catch (error) {
                  actionFailure(error);
                }
              },
            }),
          '''
              action_text = action_text[:closing] + additions + action_text[closing:]
          actions.write_text(action_text, encoding='utf-8')

          layout = Path('src/layouts/Layout.astro')
          html = layout.read_text(encoding='utf-8')
          if 'href="/apply"' not in html:
              needle = 'Editor</a>'
              pos = html.find(needle)
              if pos < 0:
                  raise SystemExit('Editor navigation marker missing')
              end = pos + len(needle)
              link = '<a href="/apply" class="text-sm font-medium text-slate-300 hover:text-sky-400 transition-colors">Apply</a>'
              html = html[:end] + link + html[end:]
          layout.write_text(html, encoding='utf-8')
          PY
      - name: Verify apply admin build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit clean apply wiring
        run: |
          git rm -f .github/workflows/temporary-apply-admin-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/okf.ts src/actions/index.ts src/layouts/Layout.astro
          git commit -m 'feat(apply): wire DuckDB preview and commit actions'
          git push
