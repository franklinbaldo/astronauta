name: Temporary body editor wire

on:
  pull_request:
    branches:
      - stack/06-write-capable-gateway

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'stack/07-body-editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/07-body-editor
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Extend server-only OKF client and navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('src/lib/okf.ts')
          text = client.read_text(encoding='utf-8')
          class_marker = 'class OkfClient'
          class_index = text.find(class_marker)
          if class_index < 0:
              raise SystemExit('OkfClient marker not found')
          types = '''export interface EditMutationInput {
            readonly concept_id: string;
            readonly body: string;
            readonly expected_source_digest: string;
          }

          export interface MutationDiagnostic {
            readonly code: string;
            readonly path: string;
            readonly message: string;
          }

          export interface EditMutationResult {
            readonly concept_id: string;
            readonly path: string;
            readonly source_digest: string;
            readonly candidate_source_digest: string;
            readonly candidate_parsed_digest: string;
            readonly changed: boolean;
            readonly succeeded: boolean;
            readonly written: boolean;
            readonly validation: readonly MutationDiagnostic[];
            readonly conflict_paths: readonly string[];
            readonly error?: string;
          }

          '''
          if 'export interface EditMutationInput' not in text:
              text = text[:class_index] + types + text[class_index:]

          export_marker = 'export const okf = new OkfClient();'
          export_index = text.find(export_marker)
          if export_index < 0:
              raise SystemExit('okf singleton marker not found')
          class_close = text.rfind('}\n\n', 0, export_index)
          if class_close < class_index:
              raise SystemExit('OkfClient closing brace not found')
          methods = '''  editPreview(input: EditMutationInput): Promise<EditMutationResult> {
            return this.request<EditMutationResult>("edit_preview", { ...input });
          }

            editWrite(input: EditMutationInput): Promise<EditMutationResult> {
            return this.request<EditMutationResult>("edit_write", { ...input });
          }

          '''
          if 'editPreview(input: EditMutationInput)' not in text:
              text = text[:class_close] + methods + text[class_close:]
          client.write_text(text, encoding='utf-8')

          layout = Path('src/layouts/Layout.astro')
          html = layout.read_text(encoding='utf-8')
          if 'href="/editor"' not in html:
              needle = 'Conceitos</a>'
              pos = html.find(needle)
              if pos < 0:
                  raise SystemExit('Conceitos navigation marker not found')
              end = pos + len(needle)
              link = '<a href="/editor" class="text-sm font-medium text-slate-300 hover:text-sky-400 transition-colors">Editor</a>'
              html = html[:end] + link + html[end:]
          layout.write_text(html, encoding='utf-8')
          PY
      - name: Verify editor build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit clean editor wiring
        run: |
          git rm -f .github/workflows/temporary-body-editor-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/okf.ts src/layouts/Layout.astro
          git commit -m 'feat(editor): wire body edit actions through OkfClient'
          git push
