name: Refresh UV Lock

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/refresh-uv-lock.yml"

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'stack/01-okf-application-gateway'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Resolve declared Python dependencies
        run: uv lock

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uv-lock-${{ github.sha }}
          path: uv.lock
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
