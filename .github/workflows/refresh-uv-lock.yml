name: Refresh UV Lock

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-uv-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'stack/01-okf-application-gateway'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stack branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Resolve and commit declared Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: refresh Python dependency lock"
          git push origin "HEAD:${{ github.head_ref }}"
