name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify compiled styles
        run: bun run verify

  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Run gateway contract tests
        run: uv run python -m unittest discover -s tests -v

      - name: Smoke gateway JSON boundary
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/okf"
          mkdir -p "$fixture"
          printf '%s\n' '---' 'type: Note' 'title: Hello' '---' '# Hello' > "$fixture/hello.md"
          uv run python -m astronauta.gateway "$fixture" summary > "$RUNNER_TEMP/summary.json"
          python -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["total_concepts"] == 1 and data["concepts_by_type"] == {"Note": 1}' "$RUNNER_TEMP/summary.json"
