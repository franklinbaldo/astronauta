name: GraphQL adapter migration

on:
  push:
    branches: [feat/graphql-preferred-read-adapter]
    paths:
      - .github/workflows/graphql-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/graphql-preferred-read-adapter

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Apply released dependency migration
        run: python scripts/graphql_migration.py

      - name: Resolve public 0.43.0 and freeze lock
        run: |
          uv lock
          uv sync --frozen
          uv run python -c 'import importlib.metadata, graphql; assert importlib.metadata.version("okf-parser") == "0.43.0"'

      - name: Prove preferred GraphQL gateway semantics
        run: uv run python -m unittest discover -s tests -v

      - name: Commit public dependency lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock
          git commit -m "feat(gateway): consume okf-parser GraphQL 0.43.0"
          git push origin HEAD:feat/graphql-preferred-read-adapter
