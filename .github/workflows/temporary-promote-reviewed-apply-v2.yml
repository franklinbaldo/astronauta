name: Temporary promote reviewed apply v2

on:
  pull_request:
    branches:
      - stack/08-duckdb-apply-admin

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.head_ref == 'stack/09-reviewed-apply-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/09-reviewed-apply-token
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Resolve final ready upstream token PR
        run: |
          python - <<'PY' > "$RUNNER_TEMP/upstream.env"
          import json
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              'state': 'open',
              'head': 'franklinbaldo:feat/apply-reviewed-preview-token',
          })
          url = f'https://api.github.com/repos/franklinbaldo/okf-parser/pulls?{query}'
          with urllib.request.urlopen(url, timeout=30) as response:
              pulls = json.load(response)
          if len(pulls) != 1:
              raise SystemExit(f'expected one upstream token PR, found {len(pulls)}')
          pr = pulls[0]
          if pr.get('draft'):
              raise SystemExit(f"upstream PR #{pr['number']} is still draft")
          print(f"UPSTREAM_SHA={pr['head']['sha']}")
          PY
          cat "$RUNNER_TEMP/upstream.env" >> "$GITHUB_ENV"
      - name: Pin final upstream and regenerate lock
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'git\+https://github\.com/franklinbaldo/okf-parser\.git@[0-9a-f]+',
              f"git+https://github.com/franklinbaldo/okf-parser.git@{os.environ['UPSTREAM_SHA']}",
              text,
          )
          if count != 1:
              raise SystemExit(f'expected one parser pin, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
          uv lock
      - name: Validate Python and Astro surfaces
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s tests -v
          bun install --frozen-lockfile
          bun run build
      - name: Prove real reviewed-preview commit
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/reviewed-apply-okf"
          mkdir -p "$fixture"
          printf '%s\n' '---' 'type: Note' 'title: Hello' 'status: todo' '---' 'Body' > "$fixture/note.md"
          uv run astronauta "$fixture" --write --port 8765 > "$RUNNER_TEMP/gateway.log" 2>&1 &
          gateway_pid=$!
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > "$RUNNER_TEMP/astro.log" 2>&1 &
          astro_pid=$!
          trap 'kill "$astro_pid" "$gateway_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/apply > "$RUNNER_TEMP/before.html"; then break; fi
            if [ "$attempt" -eq 30 ]; then cat "$RUNNER_TEMP/gateway.log"; cat "$RUNNER_TEMP/astro.log"; exit 1; fi
            sleep 1
          done
          python - "$RUNNER_TEMP/before.html" "$RUNNER_TEMP/preview-action" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
          if len(actions) != 1: raise SystemExit(f'expected one preview form, got {actions}')
          open(sys.argv[2], 'w', encoding='utf-8').write(actions[0])
          PY
          preview_action=$(cat "$RUNNER_TEMP/preview-action")
          case "$preview_action" in http*) preview_url="$preview_action" ;; *) preview_url="http://127.0.0.1:4321$preview_action" ;; esac
          sql='UPDATE "Note" SET status = '\''done'\'' WHERE __okf_concept_id = '\''note'\'''
          curl --fail --silent -X POST "$preview_url" --data-urlencode "sql=$sql" > "$RUNNER_TEMP/preview.html"
          grep -F 'status: todo' "$fixture/note.md"
          python - "$RUNNER_TEMP/preview.html" "$RUNNER_TEMP/commit-action" "$RUNNER_TEMP/token" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
          if len(actions) < 2: raise SystemExit(f'expected commit + preview forms, got {actions}')
          token = re.search(r'name="preview_token" value="([^"]+)"', html)
          if token is None: raise SystemExit('preview token hidden field missing')
          open(sys.argv[2], 'w', encoding='utf-8').write(actions[0])
          open(sys.argv[3], 'w', encoding='utf-8').write(token.group(1))
          PY
          commit_action=$(cat "$RUNNER_TEMP/commit-action")
          preview_token=$(cat "$RUNNER_TEMP/token")
          case "$commit_action" in http*) commit_url="$commit_action" ;; *) commit_url="http://127.0.0.1:4321$commit_action" ;; esac
          curl --fail --silent -X POST "$commit_url" --data-urlencode "sql=$sql" --data-urlencode "preview_token=$preview_token" > "$RUNNER_TEMP/commit.html"
          grep -F 'Alterações gravadas' "$RUNNER_TEMP/commit.html"
          grep -F 'status: done' "$fixture/note.md"
      - name: Rebuild one clean semantic commit
        run: |
          set -euo pipefail
          git fetch origin stack/08-duckdb-apply-admin
          git reset --soft origin/stack/08-duckdb-apply-admin
          temporary=$(git ls-files '.github/workflows/temporary-*.yml' || true)
          if [ -n "$temporary" ]; then
            while IFS= read -r workflow; do git rm -f --cached "$workflow"; rm -f "$workflow"; done <<< "$temporary"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(apply): bind commit to reviewed preview token'
          git push --force-with-lease origin HEAD:stack/09-reviewed-apply-token
      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
