name: Temporary reviewed apply wire

on:
  pull_request:
    branches:
      - stack/08-duckdb-apply-admin

permissions:
  contents: write

jobs:
  wire:
    if: github.head_ref == 'stack/09-reviewed-apply-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/09-reviewed-apply-token
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Resolve immutable upstream reviewed-preview head
        id: upstream
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/franklinbaldo/okf-parser.git refs/heads/feat/apply-reviewed-preview-token | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Pin upstream and wire token through gateway, Actions and UI
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              return text.replace(old, new, 1)

          sha = os.environ['UPSTREAM_SHA']
          project = Path('pyproject.toml')
          text = project.read_text(encoding='utf-8')
          pattern = r'git\+https://github\.com/franklinbaldo/okf-parser\.git@[0-9a-f]+'
          replacement = f'git+https://github.com/franklinbaldo/okf-parser.git@{sha}'
          text, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit(f'expected one okf-parser git pin, found {count}')
          project.write_text(text, encoding='utf-8')

          mutations = Path('src/astronauta/mutations.py')
          source = mutations.read_text(encoding='utf-8')
          old_apply = '''    if capability in {"apply_preview", "apply_write"}:
              sql = _required_string(payload, "sql")
              if capability == "apply_write" and not allow_write:
                  raise WriteCapabilityDisabled(
                      "write capabilities are disabled; start Astronauta with --write"
                  )
              return apply_bundle(
                  str(root),
                  sql=sql,
                  write=capability == "apply_write",
                  spec_template=spec_template,
              )
          '''.replace('              ', '')
          new_apply = '''    if capability in {"apply_preview", "apply_write"}:
              sql = _required_string(payload, "sql")
              if capability == "apply_write":
                  if not allow_write:
                      raise WriteCapabilityDisabled(
                          "write capabilities are disabled; start Astronauta with --write"
                      )
                  preview_token = _required_string(payload, "preview_token")
                  return apply_bundle(
                      str(root),
                      sql=sql,
                      write=True,
                      expected_preview_token=preview_token,
                      spec_template=spec_template,
                  )
              return apply_bundle(
                  str(root),
                  sql=sql,
                  write=False,
                  spec_template=spec_template,
              )
          '''.replace('              ', '')
          source = replace_once(source, old_apply, new_apply, 'mutation apply branch')
          mutations.write_text(source, encoding='utf-8')

          client = Path('src/lib/okf.ts')
          ts = client.read_text(encoding='utf-8')
          ts = replace_once(
              ts,
              '  readonly error?: string;\n}\n\nclass OkfClient',
              '  readonly error?: string;\n  readonly preview_token?: string;\n}\n\nclass OkfClient',
              'ApplyMutationResult preview token',
          )
          ts = replace_once(
              ts,
              '  applyWrite(sql: string): Promise<ApplyMutationResult> {\n    return this.request<ApplyMutationResult>("apply_write", { sql });\n  }\n',
              '  applyWrite(sql: string, previewToken: string): Promise<ApplyMutationResult> {\n    return this.request<ApplyMutationResult>("apply_write", { sql, preview_token: previewToken });\n  }\n',
              'OkfClient applyWrite',
          )
          client.write_text(ts, encoding='utf-8')

          actions = Path('src/actions/index.ts')
          ats = actions.read_text(encoding='utf-8')
          ats = replace_once(
              ats,
              'const applyInput = z.object({\n  sql: z.string().min(1).max(256 * 1024),\n});\n',
              'const applyPreviewInput = z.object({\n  sql: z.string().min(1).max(256 * 1024),\n});\n\nconst applyCommitInput = applyPreviewInput.extend({\n  preview_token: z.string().regex(/^okf-apply-preview-v1-sha256:[0-9a-f]{64}$/u),\n});\n',
              'apply action schemas',
          )
          ats = replace_once(ats, 'input: applyInput,\n    handler: async (input) => {\n      try {\n        return {\n          input,\n          mutation: await okf.applyPreview(input.sql),', 'input: applyPreviewInput,\n    handler: async (input) => {\n      try {\n        return {\n          input,\n          mutation: await okf.applyPreview(input.sql),', 'applyPreview input')
          ats = replace_once(ats, 'input: applyInput,\n    handler: async (input) => {\n      try {\n        return {\n          input,\n          mutation: await okf.applyWrite(input.sql),', 'input: applyCommitInput,\n    handler: async (input) => {\n      try {\n        return {\n          input,\n          mutation: await okf.applyWrite(input.sql, input.preview_token),', 'applyCommit input')
          actions.write_text(ats, encoding='utf-8')

          page = Path('src/pages/apply.astro')
          html = page.read_text(encoding='utf-8')
          old_form = '''        {previewMutation.succeeded && previewMutation.changed_paths.length > 0 && previewData && (
              <form method="POST" action={actions.applyCommit}>
                <textarea name="sql" class="hidden">{previewData.input.sql}</textarea>
                <button type="submit" class="rounded bg-emerald-600 hover:bg-emerald-500 px-4 py-2 text-sm font-semibold text-white transition">
          '''.replace('              ', '')
          new_form = '''        {previewMutation.succeeded && previewMutation.changed_paths.length > 0 && previewMutation.preview_token && previewData && (
              <form method="POST" action={actions.applyCommit}>
                <textarea name="sql" class="hidden">{previewData.input.sql}</textarea>
                <input type="hidden" name="preview_token" value={previewMutation.preview_token} />
                <button type="submit" class="rounded bg-emerald-600 hover:bg-emerald-500 px-4 py-2 text-sm font-semibold text-white transition">
          '''.replace('              ', '')
          html = replace_once(html, old_form, new_form, 'apply commit form token')
          page.write_text(html, encoding='utf-8')

          test_path = Path('tests/test_write_gateway.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_test = '''    def test_write_enabled_process_commits_duckdb_apply(self) -> None:
              url = self.start(allow_write=True)
              sql = 'UPDATE "Note" SET status = \'done\' WHERE __okf_concept_id = \'note\''

              status, payload = self.post(url, {"capability": "apply_write", "sql": sql})

              self.assertEqual(status, 200)
              result = payload["result"]
              self.assertIsInstance(result, dict)
              assert isinstance(result, dict)
              self.assertTrue(result["written"])
              self.assertIn("status: done", self.source.read_text(encoding="utf-8"))
          '''.replace('              ', '')
          new_test = '''    def test_write_enabled_process_commits_duckdb_apply(self) -> None:
              url = self.start(allow_write=True)
              sql = 'UPDATE "Note" SET status = \'done\' WHERE __okf_concept_id = \'note\''

              preview_status, preview_payload = self.post(
                  url, {"capability": "apply_preview", "sql": sql}
              )
              self.assertEqual(preview_status, 200)
              preview = preview_payload["result"]
              self.assertIsInstance(preview, dict)
              assert isinstance(preview, dict)
              token = preview.get("preview_token")
              self.assertIsInstance(token, str)

              status, payload = self.post(
                  url,
                  {"capability": "apply_write", "sql": sql, "preview_token": token},
              )

              self.assertEqual(status, 200)
              result = payload["result"]
              self.assertIsInstance(result, dict)
              assert isinstance(result, dict)
              self.assertTrue(result["written"])
              self.assertEqual(result["preview_token"], token)
              self.assertIn("status: done", self.source.read_text(encoding="utf-8"))
          '''.replace('              ', '')
          test_text = replace_once(test_text, old_test, new_test, 'gateway apply write test')
          test_path.write_text(test_text, encoding='utf-8')

          workflow = Path('.github/workflows/live-apply.yml')
          yml = workflow.read_text(encoding='utf-8')
          old_extract = '''          python - "$RUNNER_TEMP/preview.html" "$RUNNER_TEMP/commit-action" <<'PY'
              import re
              import sys

              html = open(sys.argv[1], encoding="utf-8").read()
              actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
              if len(actions) < 2:
                  raise SystemExit(f"expected commit and preview forms, got {actions}")
              open(sys.argv[2], "w", encoding="utf-8").write(actions[0])
              PY
          '''.replace('              ', '')
          new_extract = '''          python - "$RUNNER_TEMP/preview.html" "$RUNNER_TEMP/commit-action" "$RUNNER_TEMP/preview-token" <<'PY'
              import re
              import sys

              html = open(sys.argv[1], encoding="utf-8").read()
              actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
              if len(actions) < 2:
                  raise SystemExit(f"expected commit and preview forms, got {actions}")
              open(sys.argv[2], "w", encoding="utf-8").write(actions[0])
              token = re.search(r'name="preview_token" value="([^"]+)"', html)
              if token is None:
                  raise SystemExit("preview token field missing")
              open(sys.argv[3], "w", encoding="utf-8").write(token.group(1))
              PY
          '''.replace('              ', '')
          yml = replace_once(yml, old_extract, new_extract, 'live apply token extraction')
          yml = replace_once(
              yml,
              '          commit_action=$(cat "$RUNNER_TEMP/commit-action")\n',
              '          commit_action=$(cat "$RUNNER_TEMP/commit-action")\n          preview_token=$(cat "$RUNNER_TEMP/preview-token")\n',
              'live apply token shell variable',
          )
          yml = replace_once(
              yml,
              '          curl --fail --silent -X POST "$commit_url" \\\n            --data-urlencode "sql=$sql" > "$RUNNER_TEMP/commit.html"\n',
              '          curl --fail --silent -X POST "$commit_url" \\\n            --data-urlencode "sql=$sql" \\\n            --data-urlencode "preview_token=$preview_token" > "$RUNNER_TEMP/commit.html"\n',
              'live apply commit payload',
          )
          workflow.write_text(yml, encoding='utf-8')
          PY
          uv lock
      - name: Validate reviewed apply stack
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s tests -v
          bun install --frozen-lockfile
          bun run build
      - name: Commit clean reviewed-apply wiring
        run: |
          git rm -f .github/workflows/temporary-reviewed-apply-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock src/astronauta/mutations.py src/lib/okf.ts \
            src/actions/index.ts src/pages/apply.astro tests/test_write_gateway.py \
            .github/workflows/live-apply.yml
          git commit -m 'fix(apply): bind commit to reviewed preview token'
          git push
