name: Finalize Tailwind Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-tailwind-lock
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/tailwind-build-contract
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Resolve dependencies and verify output
        run: |
          set -euo pipefail
          bun install
          bun run verify

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock
          git commit -m "chore: refresh Bun lockfile"
          git push origin HEAD:fix/tailwind-build-contract
