name: Temporary diagnose reviewed apply

on:
  push:
    branches: [stack/09-reviewed-apply-token]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'chore: record reviewed apply gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/09-reviewed-apply-token
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Run the final-tree gate and capture its result
        shell: bash
        run: |
          set -uo pipefail
          keep="$RUNNER_TEMP/reviewed-apply"
          log="$RUNNER_TEMP/reviewed-apply-gate.txt"
          mkdir -p "$keep/src/actions" "$keep/src/astronauta" "$keep/src/lib/server" "$keep/src/pages" "$keep/tests"
          cp pyproject.toml "$keep/pyproject.toml"
          cp src/actions/index.ts "$keep/src/actions/index.ts"
          cp src/astronauta/mutations.py "$keep/src/astronauta/mutations.py"
          cp src/lib/server/okf.ts "$keep/src/lib/server/okf.ts"
          cp src/pages/apply.astro "$keep/src/pages/apply.astro"
          cp tests/test_apply_preview_binding.py "$keep/tests/test_apply_preview_binding.py"
          cp tests/test_write_gateway.py "$keep/tests/test_write_gateway.py"

          status=0
          (
            set -euxo pipefail
            git fetch origin stack/08-duckdb-apply-admin
            git reset --hard origin/stack/08-duckdb-apply-admin
            mkdir -p src/actions src/astronauta src/lib/server src/pages tests
            cp "$keep/pyproject.toml" pyproject.toml
            cp "$keep/src/actions/index.ts" src/actions/index.ts
            cp "$keep/src/astronauta/mutations.py" src/astronauta/mutations.py
            cp "$keep/src/lib/server/okf.ts" src/lib/server/okf.ts
            cp "$keep/src/pages/apply.astro" src/pages/apply.astro
            cp "$keep/tests/test_apply_preview_binding.py" tests/test_apply_preview_binding.py
            cp "$keep/tests/test_write_gateway.py" tests/test_write_gateway.py
            grep -F 'okf-parser.git@9da4b53724295b759a9cfbc83ed3f1d4d6291f8c' pyproject.toml
            grep -F 'expected_preview_token=preview_token' src/astronauta/mutations.py
            grep -F 'applyWrite(input.sql, input.preview_token)' src/actions/index.ts
            grep -F 'name="preview_token"' src/pages/apply.astro
            uv lock
            uv sync --frozen
            uv run python -m unittest discover -s tests -v
            uv build
            bun install --frozen-lockfile
            bun run verify
            bun run build
          ) > "$log" 2>&1 || status=$?

          echo "FINAL_GATE_EXIT=$status" >> "$log"
          git fetch origin stack/09-reviewed-apply-token
          git reset --hard origin/stack/09-reviewed-apply-token
          cp "$log" reviewed-apply-gate.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reviewed-apply-gate.txt
          git commit -m 'chore: record reviewed apply gate'
          git push origin HEAD:stack/09-reviewed-apply-token
