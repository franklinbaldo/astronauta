name: Temporary finalize reviewed apply

on:
  pull_request:
    branches:
      - stack/08-duckdb-apply-admin

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'stack/09-reviewed-apply-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/09-reviewed-apply-token
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Require reviewed-preview wiring
        run: |
          grep -F 'expected_preview_token=preview_token' src/astronauta/mutations.py
          grep -F 'preview_token' src/pages/apply.astro
          grep -F 'applyWrite(input.sql, input.preview_token)' src/actions/index.ts
      - name: Validate exact stack head
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s tests -v
          bun install --frozen-lockfile
          bun run build
      - name: Rebuild as one clean semantic commit
        run: |
          set -euo pipefail
          git fetch origin stack/08-duckdb-apply-admin
          git reset --soft origin/stack/08-duckdb-apply-admin
          temporary=$(git ls-files '.github/workflows/temporary-*.yml' || true)
          if [ -n "$temporary" ]; then
            while IFS= read -r workflow; do
              git rm -f --cached "$workflow"
              rm -f "$workflow"
            done <<< "$temporary"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(apply): bind commit to reviewed preview token'
          git push --force-with-lease origin HEAD:stack/09-reviewed-apply-token
