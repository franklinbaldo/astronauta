name: Temporary finalize reviewed apply

on:
  pull_request:
    branches: [stack/09-reviewed-apply-token]
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'ops/trigger-reviewed-apply-finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed-apply branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stack/09-reviewed-apply-token
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Reconstruct final semantic tree
        shell: bash
        run: |
          set -euxo pipefail
          keep="$RUNNER_TEMP/reviewed-apply"
          mkdir -p "$keep/src/actions" "$keep/src/astronauta" "$keep/src/lib/server" "$keep/src/pages" "$keep/tests"
          cp pyproject.toml "$keep/pyproject.toml"
          cp src/actions/index.ts "$keep/src/actions/index.ts"
          cp src/astronauta/mutations.py "$keep/src/astronauta/mutations.py"
          cp src/lib/server/okf.ts "$keep/src/lib/server/okf.ts"
          cp src/pages/apply.astro "$keep/src/pages/apply.astro"
          cp tests/test_apply_preview_binding.py "$keep/tests/test_apply_preview_binding.py"
          cp tests/test_write_gateway.py "$keep/tests/test_write_gateway.py"

          git fetch origin stack/08-duckdb-apply-admin
          git reset --hard origin/stack/08-duckdb-apply-admin
          cp "$keep/pyproject.toml" pyproject.toml
          cp "$keep/src/actions/index.ts" src/actions/index.ts
          cp "$keep/src/astronauta/mutations.py" src/astronauta/mutations.py
          cp "$keep/src/lib/server/okf.ts" src/lib/server/okf.ts
          cp "$keep/src/pages/apply.astro" src/pages/apply.astro
          cp "$keep/tests/test_apply_preview_binding.py" tests/test_apply_preview_binding.py
          cp "$keep/tests/test_write_gateway.py" tests/test_write_gateway.py

          uv lock
          grep -F '9da4b53707598ab505acf2f9c4493aa23d252f72' pyproject.toml
          test "$(grep -o '9da4b53707598ab505acf2f9c4493aa23d252f72' uv.lock | wc -l)" -eq 3
          ! grep -F '68e630c4ca66864dee022af0a8c7b19375a33538' uv.lock
          python - <<'PY'
          from pathlib import Path
          text = Path('uv.lock').read_text()
          block = text.split('name = "okf-parser"', 1)[1].split('[[package]]', 1)[0]
          assert 'version = "0.37.0"' in block, block[:500]
          PY

      - name: Python gates
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s tests -v
          uv build

      - name: Astro gates
        run: |
          bun install --frozen-lockfile
          bun run verify
          bun run build

      - name: Reviewed-preview E2E
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/reviewed-apply-okf"
          page_url='http://127.0.0.1:4321/apply'
          mkdir -p "$fixture"
          printf '%s\n' '---' 'type: Note' 'title: Hello' 'status: todo' '---' 'Body' > "$fixture/note.md"

          uv run astronauta "$fixture" --write --port 8765 > "$RUNNER_TEMP/gateway.log" 2>&1 &
          gateway_pid=$!
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > "$RUNNER_TEMP/astro.log" 2>&1 &
          astro_pid=$!
          trap 'kill "$astro_pid" "$gateway_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$page_url" > "$RUNNER_TEMP/before.html"; then break; fi
            if [ "$attempt" -eq 30 ]; then cat "$RUNNER_TEMP/gateway.log"; cat "$RUNNER_TEMP/astro.log"; exit 1; fi
            sleep 1
          done

          python - "$RUNNER_TEMP/before.html" "$RUNNER_TEMP/action" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
          if len(actions) != 1 or 'applyPreview' not in actions[0]:
              raise SystemExit(actions)
          open(sys.argv[2], 'w').write(actions[0])
          PY
          action=$(cat "$RUNNER_TEMP/action")
          case "$action" in
            http*) url="$action" ;;
            \?*) url="$page_url$action" ;;
            /*) url="http://127.0.0.1:4321$action" ;;
            *) url="http://127.0.0.1:4321/$action" ;;
          esac
          sql='UPDATE "Note" SET status = '\''done'\'' WHERE __okf_concept_id = '\''note'\'''
          curl --fail-with-body --silent --show-error "$url" \
            --header 'Origin: http://127.0.0.1:4321' \
            --header "Referer: $page_url" \
            --data-urlencode "sql=$sql" > "$RUNNER_TEMP/preview.html"
          grep -F 'status: todo' "$fixture/note.md"

          python - "$RUNNER_TEMP/preview.html" "$RUNNER_TEMP/action" "$RUNNER_TEMP/token" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          actions = [a for a in re.findall(r'<form[^>]+action="([^"]+)"', html) if 'applyCommit' in a]
          token = re.search(r'name="preview_token" value="([^"]+)"', html)
          if len(actions) != 1 or token is None:
              raise SystemExit('commit form/token missing')
          open(sys.argv[2], 'w').write(actions[0])
          open(sys.argv[3], 'w').write(token.group(1))
          PY
          action=$(cat "$RUNNER_TEMP/action")
          token=$(cat "$RUNNER_TEMP/token")
          case "$action" in
            http*) url="$action" ;;
            \?*) url="$page_url$action" ;;
            /*) url="http://127.0.0.1:4321$action" ;;
            *) url="http://127.0.0.1:4321/$action" ;;
          esac
          curl --fail-with-body --silent --show-error "$url" \
            --header 'Origin: http://127.0.0.1:4321' \
            --header "Referer: $page_url" \
            --data-urlencode "sql=$sql" \
            --data-urlencode "preview_token=$token" > "$RUNNER_TEMP/commit.html"
          grep -F 'Alterações gravadas' "$RUNNER_TEMP/commit.html"
          grep -F 'status: done' "$fixture/note.md"

      - name: Create the single semantic commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            pyproject.toml uv.lock \
            src/actions/index.ts \
            src/astronauta/mutations.py \
            src/lib/server/okf.ts \
            src/pages/apply.astro \
            tests/test_apply_preview_binding.py \
            tests/test_write_gateway.py
          expected=$(printf '%s\n' \
            pyproject.toml \
            src/actions/index.ts \
            src/astronauta/mutations.py \
            src/lib/server/okf.ts \
            src/pages/apply.astro \
            tests/test_apply_preview_binding.py \
            tests/test_write_gateway.py \
            uv.lock | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git commit -m 'fix(apply): bind commits to the reviewed DuckDB preview'

      - name: Publish only if the branch was not changed concurrently
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin stack/09-reviewed-apply-token
          remote=$(git rev-parse origin/stack/09-reviewed-apply-token)
          git push --force-with-lease=refs/heads/stack/09-reviewed-apply-token:$remote \
            origin HEAD:refs/heads/stack/09-reviewed-apply-token
