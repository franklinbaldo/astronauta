name: Visual evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install dependencies and build SSR
        run: |
          bun install --frozen-lockfile
          uv sync --frozen
          bun run build

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Prepare deterministic OKF fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/visual-okf"
          mkdir -p "$fixture"
          for i in $(seq -w 1 12); do
            printf '%s\n' \
              '---' \
              'type: Note' \
              "title: Nota $i" \
              'status: todo' \
              '---' \
              "Corpo da nota $i para prova visual do Astronauta." \
              > "$fixture/note-$i.md"
          done
          echo "fixture=$fixture" >> "$GITHUB_ENV"

      - name: Capture read-only dense list
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          .venv/bin/astronauta "$fixture" --port 4321 > "$RUNNER_TEMP/read-runtime.log" 2>&1 &
          runtime_pid=$!
          trap 'kill -TERM "$runtime_pid" 2>/dev/null || true; wait "$runtime_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/types/Note > "$RUNNER_TEMP/read.html"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/read-runtime.log"
              exit 1
            fi
            sleep 1
          done

          grep -F 'Nota 01' "$RUNNER_TEMP/read.html"
          grep -F 'Nota 12' "$RUNNER_TEMP/read.html"

          "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --window-size=1280,900 \
            --screenshot=artifacts/read-1280x900.png \
            http://127.0.0.1:4321/types/Note
          "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --window-size=390,844 \
            --screenshot=artifacts/read-390x844.png \
            http://127.0.0.1:4321/types/Note

          kill -TERM "$runtime_pid"
          wait "$runtime_pid"
          trap - EXIT

      - name: Capture write-enabled review state
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          .venv/bin/astronauta "$fixture" --write --port 4322 > "$RUNNER_TEMP/write-runtime.log" 2>&1 &
          runtime_pid=$!
          trap 'kill -TERM "$runtime_pid" 2>/dev/null || true; wait "$runtime_pid" 2>/dev/null || true' EXIT

          page_url='http://127.0.0.1:4322/concepts/edit/note-01'
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$page_url" > "$RUNNER_TEMP/write.html"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/write-runtime.log"
              exit 1
            fi
            sleep 1
          done

          grep -F 'Corpo da nota 01' "$RUNNER_TEMP/write.html"
          grep -F 'expected_source_digest' "$RUNNER_TEMP/write.html"

          "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --window-size=1280,900 \
            --screenshot=artifacts/write-1280x900.png \
            "$page_url"
          "$CHROME" --headless=new --no-sandbox --disable-gpu \
            --run-all-compositor-stages-before-draw \
            --window-size=390,844 \
            --screenshot=artifacts/write-390x844.png \
            "$page_url"

          kill -TERM "$runtime_pid"
          wait "$runtime_pid"
          trap - EXIT

      - name: Write machine-readable evidence manifest
        env:
          EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_REF_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "evaluated_sha": os.environ["EVALUATED_SHA"],
              "merge_ref_sha": os.environ["MERGE_REF_SHA"] if os.environ["EVENT_NAME"] == "pull_request" else None,
              "event": os.environ["EVENT_NAME"],
              "captures": [
                  {"mode": "read-only", "route": "/types/Note", "viewport": {"width": 1280, "height": 900}, "file": "read-1280x900.png"},
                  {"mode": "read-only", "route": "/types/Note", "viewport": {"width": 390, "height": 844}, "file": "read-390x844.png"},
                  {"mode": "write-enabled", "route": "/concepts/edit/note-01", "viewport": {"width": 1280, "height": 900}, "file": "write-1280x900.png"},
                  {"mode": "write-enabled", "route": "/concepts/edit/note-01", "viewport": {"width": 390, "height": 844}, "file": "write-390x844.png"},
              ],
              "functional_proof": {
                  "read_fixture_first": "Nota 01",
                  "read_fixture_last": "Nota 12",
                  "write_review_identity_field": "expected_source_digest",
              },
          }
          Path("artifacts/evidence.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astronauta-rendered-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
          if-no-files-found: error
