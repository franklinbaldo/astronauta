name: Live import

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: live-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-preview-reviewed-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install locked dependencies and build SSR
        run: |
          bun install --frozen-lockfile
          uv sync --frozen
          bun run build

      - name: Preview then commit parser-owned import through the live UI
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/import-okf"
          page_url='http://127.0.0.1:4321/import'
          mkdir -p "$fixture/imports"
          printf '%s\n' 'slug,title' 'alpha,Alpha' 'beta,Beta' > "$fixture/imports/notes.csv"

          uv run python -m astronauta.gateway_http "$fixture" --write --port 8765 > "$RUNNER_TEMP/gateway.log" 2>&1 &
          gateway_pid=$!
          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > "$RUNNER_TEMP/astro.log" 2>&1 &
          astro_pid=$!
          trap 'kill "$astro_pid" "$gateway_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              --header 'content-type: application/json' \
              --data '{"capability":"summary"}' \
              http://127.0.0.1:8765/gateway > "$RUNNER_TEMP/gateway-ready.json"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/gateway.log"
              exit 1
            fi
            sleep 1
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent "$page_url" > "$RUNNER_TEMP/before.html"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/gateway.log"
              cat "$RUNNER_TEMP/astro.log"
              exit 1
            fi
            sleep 1
          done

          python - "$RUNNER_TEMP/before.html" "$RUNNER_TEMP/preview-action" <<'PY'
          import re
          import sys

          html = open(sys.argv[1], encoding="utf-8").read()
          actions = re.findall(r'<form[^>]+action="([^"]+)"', html)
          matches = [action for action in actions if "importPreview" in action]
          if len(matches) != 1:
              raise SystemExit(f"expected one initial importPreview form, got {actions}")
          open(sys.argv[2], "w", encoding="utf-8").write(matches[0])
          PY

          preview_action=$(cat "$RUNNER_TEMP/preview-action")
          case "$preview_action" in
            http*) preview_url="$preview_action" ;;
            \?*) preview_url="$page_url$preview_action" ;;
            /*) preview_url="http://127.0.0.1:4321$preview_action" ;;
            *) preview_url="http://127.0.0.1:4321/$preview_action" ;;
          esac

          preview_status=$(curl --silent --show-error --output "$RUNNER_TEMP/preview.html" --write-out '%{http_code}' "$preview_url" \
            --header 'Origin: http://127.0.0.1:4321' \
            --header "Referer: $page_url" \
            --data-urlencode 'source=imports/notes.csv' \
            --data-urlencode 'concept_type=Note' \
            --data-urlencode 'id_column=slug' \
            --data-urlencode 'overwrite=false' \
            --data-urlencode 'on_conflict=skip')
          if [ "$preview_status" != 200 ]; then
            echo "preview HTTP $preview_status"
            cat "$RUNNER_TEMP/preview.html"
            cat "$RUNNER_TEMP/astro.log"
            cat "$RUNNER_TEMP/gateway.log"
            exit 1
          fi

          grep -F '2 arquivo(s) candidato(s)' "$RUNNER_TEMP/preview.html"
          grep -F 'note/alpha.md' "$RUNNER_TEMP/preview.html"
          grep -F 'note/beta.md' "$RUNNER_TEMP/preview.html"
          test ! -e "$fixture/note/alpha.md"
          test ! -e "$fixture/note/beta.md"

          python - "$RUNNER_TEMP/preview.html" "$RUNNER_TEMP/commit-action" "$RUNNER_TEMP/preview-token" <<'PY'
          import html
          import re
          import sys

          page = open(sys.argv[1], encoding="utf-8").read()
          actions = re.findall(r'<form[^>]+action="([^"]+)"', page)
          matches = [action for action in actions if "importCommit" in action]
          if len(matches) != 1:
              raise SystemExit(f"expected one reviewed importCommit form, got {actions}")
          token = re.search(r'name="preview_token" value="([^"]+)"', page)
          if token is None:
              raise SystemExit("reviewed importCommit form has no preview_token")
          open(sys.argv[2], "w", encoding="utf-8").write(html.unescape(matches[0]))
          open(sys.argv[3], "w", encoding="utf-8").write(html.unescape(token.group(1)))
          PY

          commit_action=$(cat "$RUNNER_TEMP/commit-action")
          preview_token=$(cat "$RUNNER_TEMP/preview-token")
          case "$commit_action" in
            http*) commit_url="$commit_action" ;;
            \?*) commit_url="$page_url$commit_action" ;;
            /*) commit_url="http://127.0.0.1:4321$commit_action" ;;
            *) commit_url="http://127.0.0.1:4321/$commit_action" ;;
          esac

          commit_status=$(curl --silent --show-error --output "$RUNNER_TEMP/commit.html" --write-out '%{http_code}' "$commit_url" \
            --header 'Origin: http://127.0.0.1:4321' \
            --header "Referer: $page_url" \
            --data-urlencode 'source=imports/notes.csv' \
            --data-urlencode 'concept_type=Note' \
            --data-urlencode 'id_column=slug' \
            --data-urlencode 'overwrite=false' \
            --data-urlencode 'on_conflict=skip' \
            --data-urlencode "preview_token=$preview_token")
          if [ "$commit_status" != 200 ]; then
            echo "commit HTTP $commit_status"
            cat "$RUNNER_TEMP/commit.html"
            cat "$RUNNER_TEMP/astro.log"
            cat "$RUNNER_TEMP/gateway.log"
            exit 1
          fi

          grep -F 'Import gravado' "$RUNNER_TEMP/commit.html"
          grep -F 'type: Note' "$fixture/note/alpha.md"
          grep -F 'slug: alpha' "$fixture/note/alpha.md"
          grep -F 'title: Alpha' "$fixture/note/alpha.md"
          grep -F 'type: Note' "$fixture/note/beta.md"
          grep -F 'slug: beta' "$fixture/note/beta.md"
          grep -F 'title: Beta' "$fixture/note/beta.md"
